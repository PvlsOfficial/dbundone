stages:
  - build

build:macos:
  stage: build
  tags:
    - Mac
  variables:
    NODE_VERSION: "20.19.0"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  before_script:
    - |
      if [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = "1" ]; then
        NODE_ARCH=arm64
      else
        NODE_ARCH=x64
      fi
    - |
      echo "Installiere Node.js $NODE_VERSION ($NODE_ARCH)..."
      mkdir -p .node
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-${NODE_ARCH}.tar.gz" | tar -xz --strip-components=1 -C .node
    - export PATH="$CI_PROJECT_DIR/.node/bin:$PATH"
    - |
      echo "Installiere Rust..."
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
    - export PATH="$CARGO_HOME/bin:$PATH"
    - node -v
    - cargo -V
    - |
      if ! which clang >/dev/null 2>&1; then
        echo "Xcode Command Line Tools fehlen auf diesem Runner."
        echo "Das kann die Pipeline nicht automatisch installieren (GUI-Lizenzdialog)."
        echo "Bitte auf dem Mac einmalig ausfuehren: xcode-select --install"
        exit 1
      fi
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 1 week
  after_script:
    - |
      rm -rf "$CI_PROJECT_DIR/.node" "$CI_PROJECT_DIR/.cargo" "$CI_PROJECT_DIR/.rustup" "$CI_PROJECT_DIR/node_modules"
      find "$CI_PROJECT_DIR/src-tauri/target" -mindepth 1 -maxdepth 1 ! -name release -exec rm -rf {} + 2>/dev/null
      find "$CI_PROJECT_DIR/src-tauri/target/release" -mindepth 1 -maxdepth 1 ! -name bundle -exec rm -rf {} + 2>/dev/null
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
